# =============================================================================
# LVGL TOUCHSCREEN INTERFACE - Computerkamer 7" Panel (JC1060P470)
# =============================================================================
# Single page, 5x4 grid (this screen is much bigger than the Woonkamer panel,
# so everything fits without needing a second page).
#
# Row 0: Woonkamer/Slaapkamer/Computerkamer "on" scene buttons, TV kijken,
#        TV in bed
# Row 1: matching "Uit" buttons, Printer power toggle, Status
# Row 2: Job, Remaining, Finished, Layer, Nozzle temp
# Row 3: Bed temp, Phase, (empty x3)
# =============================================================================

lvgl:
  buffer_size: 100%
  on_idle:
    timeout: 10min
    then:
      - light.turn_off: display_backlight
      - lvgl.pause:
          show_snow: false
      - globals.set:
          id: screen_asleep
          value: 'true'
  top_layer:
    widgets:
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          y: 4
          text_align: center
          text_color: 0xFFFFFF

  pages:
    - id: main_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1), fr(1)]
      scrollbar_mode: "off"
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 34
      pad_bottom: 5
      pad_left: 5
      pad_right: 5

      widgets:

        # ------------------- ROW 0: "on" scene buttons + TV ----------------
        - button:
            checkable: true
            id: woonkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $sofa
              - label:
                  align: bottom_mid
                  text: "Woonkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.standaard_lampen_kleur

        - button:
            checkable: true
            id: slaapkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $bed
              - label:
                  align: bottom_mid
                  text: "Slaapkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.standaard_lampen_slaapkamer

        - button:
            checkable: true
            id: computerkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $desktop_tower_monitor
              - label:
                  align: bottom_mid
                  text: "Computerkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_computerkamer

        - button:
            checkable: true
            id: tv_ambient_button
            styles: control
            grid_cell_column_pos: 3
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $ledstrip
              - label:
                  align: bottom_mid
                  text: "TV kijken"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.ambient_lighting_voor_tv_kijken

        - button:
            checkable: true
            id: tv_bed_button
            styles: control
            grid_cell_column_pos: 4
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $ledstrip
              - label:
                  align: bottom_mid
                  text: "TV in bed"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.tv_kijken_in_bed

        # ------------------- ROW 1: "Uit" buttons + Printer + Status -------
        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_woonkamer_uit

        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_slaapkamer_uit

        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_computerkamer_uit

        - button:
            checkable: true
            id: printer_button
            styles: control
            grid_cell_column_pos: 3
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $printer
              - label:
                  align: top_right
                  id: printer_progress_label
                  text: "--%"
              - label:
                  align: bottom_mid
                  text: "Printer"
            on_press:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.bambulab_a1_mini_stopcontact_1

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 4
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: printer_status_label
                  text: "--"

        # ------------------- ROW 2: Job, Remaining, Finished, Layer, Nozzle
        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $file_document_outline
              - label:
                  align: bottom_mid
                  id: printer_job_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $timer_sand
              - label:
                  align: bottom_mid
                  id: printer_remaining_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $clock_check_outline
              - label:
                  align: bottom_mid
                  id: printer_finish_label
                  text: "--:--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 3
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $layers_outline
              - label:
                  align: bottom_mid
                  id: printer_layer_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 4
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: printer_nozzle_label
                  text: "--"

        # ------------------- ROW 3: Bed temp, Phase -------------------------
        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: printer_bed_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: printer_phase_label
                  text: "--"

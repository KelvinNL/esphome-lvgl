# =============================================================================
# LVGL TOUCHSCREEN INTERFACE - Computerkamer 7" Panel (JC1060P470)
# =============================================================================
# 5x4 grid, two pages.
#
# PAGE 1 (main_page):
#   Row 0: Woonkamer / Slaapkamer / Computerkamer "on" buttons
#   Row 1: matching "Uit" buttons (plain, no highlight)
#   Row 2: TV kijken, TV in bed, Ambience Lighting (opens a popup with
#          color choices - Paars/Rood/Groen - like a bubble-card selector)
#   Row 3: More -> page 2 (bottom-right)
#
# PAGE 2 (printers_page) - both printers side by side:
#   Row 0-1: A1 Mini (power toggle, status, job, remaining, finished,
#            layer, nozzle temp, bed temp, phase)
#   Row 2-3: A1 (status-only tile - no smart plug - then the same stats)
#   Back -> page 1 (bottom-right)
# =============================================================================

lvgl:
  buffer_size: 100%
  on_idle:
    timeout: 10min
    then:
      - light.turn_off: display_backlight
      - lvgl.pause:
          show_snow: false
      - globals.set:
          id: screen_asleep
          value: 'true'
  top_layer:
    widgets:
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          y: 4
          text_align: center
          text_color: 0xFFFFFF

      - label:
          text_font: icon_font_small
          text: $thermometer
          align: top_left
          x: 8
          y: 4
          text_color: 0xFFFFFF

      - label:
          text: "--.-° / --.-°"
          id: temperatures_label
          text_font: clockbar_font
          align: top_left
          x: 34
          y: 4
          text_color: 0xFFFFFF

  msgboxes:
    - id: ambience_msgbox
      title: "Ambience Lighting"
      body: "Kies een sfeer voor de Computerkamer"
      close_button: true
      buttons:
        - text: "Bandos GWD"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.bandos_gwd
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Chambers of Xeric"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.chambers_of_xeric
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Corrupted Gauntlet"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.corrupted_gauntlet
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Hueycoatl"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.hueycoatl
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Royal Titans"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.royal_titans
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Tombs of Amascut"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.tombs_of_amascut
            - lvgl.msgbox.close: ambience_msgbox
        - text: "Zamorak GWD"
          on_click:
            - homeassistant.service:
                service: scene.turn_on
                data:
                  entity_id: scene.zamorak_gwd
            - lvgl.msgbox.close: ambience_msgbox

  pages:

    # ===================================================================
    # PAGE 1: room / scene controls
    # ===================================================================
    - id: main_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1), fr(1)]
      scrollbar_mode: "off"
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 34
      pad_bottom: 5
      pad_left: 5
      pad_right: 5

      widgets:

        # ------------------- ROW 0: "on" buttons + TV -----------------
        - button:
            checkable: true
            id: woonkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $sofa
              - label:
                  align: bottom_mid
                  text: "Woonkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.standaard_lampen_kleur

        - button:
            checkable: true
            id: slaapkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $bed
              - label:
                  align: bottom_mid
                  text: "Slaapkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.standaard_lampen_slaapkamer

        - button:
            checkable: true
            id: computerkamer_scene_on_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $desktop_tower_monitor
              - label:
                  align: bottom_mid
                  text: "Computerkamer"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_computerkamer

        # ------------------- ROW 1: "Uit" buttons -----------------------
        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_woonkamer_uit

        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_slaapkamer_uit

        - button:
            checkable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $lightbulb_group_off
              - label:
                  align: bottom_mid
                  text: "Uit"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.lampen_computerkamer_uit

        # ------------------- ROW 2: TV + Ambience Lighting -----------------
        - button:
            checkable: true
            id: tv_ambient_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $ledstrip
              - label:
                  align: bottom_mid
                  text: "TV kijken"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.ambient_lighting_voor_tv_kijken

        - button:
            checkable: true
            id: tv_bed_button
            styles: control
            grid_cell_column_pos: 1
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $ledstrip
              - label:
                  align: bottom_mid
                  text: "TV in bed"
            on_press:
              - homeassistant.service:
                  service: scene.turn_on
                  data:
                    entity_id: scene.tv_kijken_in_bed

        - button:
            checkable: false
            id: ambience_nav_button
            styles: control
            grid_cell_column_pos: 2
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $ledstrip
              - label:
                  align: bottom_mid
                  text: "Ambience"
            on_click:
              - lvgl.msgbox.open: ambience_msgbox

        # ------------------- ROW 3: More -> page 2 ------------------------
        - button:
            checkable: false
            id: more_nav_button
            styles: control
            grid_cell_column_pos: 4
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $chevron_right
              - label:
                  align: bottom_mid
                  text: "More"
            on_click:
              - lvgl.page.show:
                  id: printers_page
                  animation: NONE
                  time: 50ms

    # ===================================================================
    # PAGE 2: both printers
    # ===================================================================
    - id: printers_page
      layout:
        type: grid
        grid_columns: [fr(1), fr(1), fr(1), fr(1), fr(1)]
        grid_rows: [fr(1), fr(1), fr(1), fr(1)]
      scrollbar_mode: "off"
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 34
      pad_bottom: 5
      pad_left: 5
      pad_right: 5

      widgets:

        # ------------------- ROW 0: A1 (power) -----------------------------
        - button:
            checkable: true
            id: a1_button
            styles: control
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $printer
              - label:
                  align: top_right
                  id: a1_progress_label
                  text: "--%"
              - label:
                  align: bottom_mid
                  text: "A1"
            on_press:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.bambulab_a1_stopcontact_1

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: a1_status_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $file_document_outline
              - label:
                  align: bottom_mid
                  id: a1_job_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 3
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $timer_sand
              - label:
                  align: bottom_mid
                  id: a1_remaining_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 4
            grid_cell_row_pos: 0
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $clock_check_outline
              - label:
                  align: bottom_mid
                  id: a1_finish_label
                  text: "--:--"

        # ------------------- ROW 1: A1 (continued) -------------------------
        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $layers_outline
              - label:
                  align: bottom_mid
                  id: a1_layer_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: a1_nozzle_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: a1_bed_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 3
            grid_cell_row_pos: 1
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: a1_phase_label
                  text: "--"

# ------------------- ROW 2: A1 MINI (status-only, no plug) --------
        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $printer
              - label:
                  align: top_right
                  id: a1mini_progress_label
                  text: "--%"
              - label:
                  align: bottom_mid
                  text: "A1 Mini"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: a1mini_status_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $file_document_outline
              - label:
                  align: bottom_mid
                  id: a1mini_job_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 3
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $timer_sand
              - label:
                  align: bottom_mid
                  id: a1mini_remaining_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 4
            grid_cell_row_pos: 2
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $clock_check_outline
              - label:
                  align: bottom_mid
                  id: a1mini_finish_label
                  text: "--:--"

        # ------------------- ROW 3: A1 MINI (continued) --------------------
        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 0
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $layers_outline
              - label:
                  align: bottom_mid
                  id: a1mini_layer_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 1
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: a1mini_nozzle_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 2
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $thermometer
              - label:
                  align: bottom_mid
                  id: a1mini_bed_label
                  text: "--"

        - button:
            clickable: false
            styles: webhook
            grid_cell_column_pos: 3
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $progress_clock
              - label:
                  align: bottom_mid
                  id: a1mini_phase_label
                  text: "--"

                - button:
            checkable: false
            id: printers_back_button
            styles: control
            grid_cell_column_pos: 4
            grid_cell_row_pos: 3
            widgets:
              - label:
                  text_font: $icon_font
                  align: center
                  y: -20
                  text: $chevron_left
              - label:
                  align: bottom_mid
                  text: "Back"
            on_click:
              - lvgl.page.show:
                  id: main_page
                  animation: NONE
                  time: 50ms

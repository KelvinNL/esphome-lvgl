# =============================================================================
# SENSORS - Computerkamer 7" Panel (JC1060P470)
# =============================================================================
# Page 1: room/scene controls - same pattern as the Woonkamer panel (scene
# buttons highlighted via a representative light, since scenes have no
# on/off state).
# Page 2: full stats for BOTH printers - the A1 (03919D533008224) and the
# A1 Mini (0309DA532001059). The A1 Mini has a smart plug so its tile is
# a power toggle; the A1 has no smart plug, so its tile is status-only.
# =============================================================================

sensor:

  # --- Top bar: indoor (Computerkamer) / outdoor temperature ---
  - platform: homeassistant
    entity_id: sensor.sensor_temperature
    id: computerkamer_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures_label
          text:
            format: "%.1f° / %.1f°"
            args: [ 'x', 'id(weather_temperature).state' ]

  - platform: homeassistant
    entity_id: weather.forecast_thuis
    attribute: temperature
    id: weather_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures_label
          text:
            format: "%.1f° / %.1f°"
            args: [ 'id(computerkamer_temperature).state', 'x' ]

  # ===================== A1 MINI (0309DA532001059) =========================

# =============================================================================
# SENSORS - Computerkamer 7" Panel (JC1060P470)
# =============================================================================
# Same room-control pattern as the Woonkamer panel (scene buttons highlighted
# via a representative light, since scenes have no on/off state), plus a
# fuller set of 3D printer stats since this screen has more room.
# =============================================================================

sensor:

  # --- 3D printer (the A1, 03919D533008224 - not the offline A1 Mini) ---
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_printvoortgang
    id: printer_progress
    on_value:
      - lvgl.label.update:
          id: printer_progress_label
          text:
            format: "%.0f%%"
            args: [ 'x' ]

  # Remaining time - sensor reports decimal HOURS, split into h/m for display
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_resterende_tijd
    id: printer_remaining
    on_value:
      - lvgl.label.update:
          id: printer_remaining_label
          text:
            format: "%dh %02dm"
            args: [ '(int)x', '(int)round((x - (int)x) * 60)' ]

  # Nozzle temperature - current / target combined into one label
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_nozzle_temperatuur
    id: printer_nozzle_current
    on_value:
      - lvgl.label.update:
          id: printer_nozzle_label
          text:
            format: "%.0f° / %.0f°"
            args: [ 'x', 'id(printer_nozzle_target).state' ]

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_doeltemperatuur_nozzle
    id: printer_nozzle_target
    on_value:
      - lvgl.label.update:
          id: printer_nozzle_label
          text:
            format: "%.0f° / %.0f°"
            args: [ 'id(printer_nozzle_current).state', 'x' ]

  # Bed temperature - current / target combined into one label
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_bedtemperatuur
    id: printer_bed_current
    on_value:
      - lvgl.label.update:
          id: printer_bed_label
          text:
            format: "%.0f° / %.0f°"
            args: [ 'x', 'id(printer_bed_target).state' ]

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_doeltemperatuur_bed
    id: printer_bed_target
    on_value:
      - lvgl.label.update:
          id: printer_bed_label
          text:
            format: "%.0f° / %.0f°"
            args: [ 'id(printer_bed_current).state', 'x' ]

  # Layer - current / total layers combined into one label
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_huidige_laag
    id: printer_current_layer
    on_value:
      - lvgl.label.update:
          id: printer_layer_label
          text:
            format: "%.0f / %.0f"
            args: [ 'x', 'id(printer_total_layers).state' ]

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_hoeveelheid_lagen
    id: printer_total_layers
    on_value:
      - lvgl.label.update:
          id: printer_layer_label
          text:
            format: "%.0f / %.0f"
            args: [ 'id(printer_current_layer).state', 'x' ]


text_sensor:

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_printstatus
    id: printer_status
    on_value:
      - lvgl.label.update:
          id: printer_status_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_huidige_fase
    id: printer_phase
    on_value:
      - lvgl.label.update:
          id: printer_phase_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_taaknaam
    id: printer_job_name
    on_value:
      - lvgl.label.update:
          id: printer_job_label
          text: !lambda return x.c_str();

  # Estimated finish time - sensor reports a UTC ISO8601 timestamp.
  # Parses HH:MM and shifts +2h for Amsterdam summer time (CEST).
  # NOTE: switch this to +1 once the Netherlands moves to winter time (CET).
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_eindtijd
    id: printer_finish_time
    on_value:
      - lvgl.label.update:
          id: printer_finish_label
          text: !lambda |-
            std::string iso = x;
            if (iso.length() < 16) return std::string("--:--");
            int hour = atoi(iso.substr(11, 2).c_str());
            int minute = atoi(iso.substr(14, 2).c_str());
            hour = (hour + 2) % 24;
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", hour, minute);
            return std::string(buf);


binary_sensor:

  # ---------------------------------------------------------------------
  # WOONKAMER - Proxy: light.staande_lamp
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: woonkamer_light_state
    entity_id: light.staande_lamp
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: woonkamer_scene_on_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # SLAAPKAMER - Proxy: light.bedlamp_kel
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: slaapkamer_light_state
    entity_id: light.bedlamp_kel
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: slaapkamer_scene_on_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # COMPUTERKAMER - Proxy: light.393d0976_8033_4897_a389_633158737c15_1
  # (Plank Lamp)
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: computerkamer_light_state
    entity_id: light.393d0976_8033_4897_a389_633158737c15_1
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: computerkamer_scene_on_button

text_sensor:

  # ---- A1 Mini text fields ----
  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_printstatus
    id: a1mini_status
    on_value:
      - lvgl.label.update:
          id: a1mini_status_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_huidige_fase
    id: a1mini_phase
    on_value:
      - lvgl.label.update:
          id: a1mini_phase_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_taaknaam
    id: a1mini_job_name
    on_value:
      - lvgl.label.update:
          id: a1mini_job_label
          text: !lambda return x.c_str();

  # A1 Mini finish time - UTC ISO8601, shifted +2h for Amsterdam summer
  # time (CEST). NOTE: switch to +1 once NL moves to winter time (CET).
  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_eindtijd
    id: a1mini_finish_time
    on_value:
      - lvgl.label.update:
          id: a1mini_finish_label
          text: !lambda |-
            std::string iso = x;
            if (iso.length() < 16) return std::string("--:--");
            int hour = atoi(iso.substr(11, 2).c_str());
            int minute = atoi(iso.substr(14, 2).c_str());
            hour = (hour + 2) % 24;
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", hour, minute);
            return std::string(buf);

  # ---- A1 text fields ----
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_printstatus
    id: a1_status
    on_value:
      - lvgl.label.update:
          id: a1_status_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_huidige_fase
    id: a1_phase
    on_value:
      - lvgl.label.update:
          id: a1_phase_label
          text: !lambda return x.c_str();

  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_taaknaam
    id: a1_job_name
    on_value:
      - lvgl.label.update:
          id: a1_job_label
          text: !lambda return x.c_str();

  # A1 finish time - same UTC->CEST conversion as A1 Mini above
  - platform: homeassistant
    entity_id: sensor.a1_03919d533008224_eindtijd
    id: a1_finish_time
    on_value:
      - lvgl.label.update:
          id: a1_finish_label
          text: !lambda |-
            std::string iso = x;
            if (iso.length() < 16) return std::string("--:--");
            int hour = atoi(iso.substr(11, 2).c_str());
            int minute = atoi(iso.substr(14, 2).c_str());
            hour = (hour + 2) % 24;
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", hour, minute);
            return std::string(buf);


binary_sensor:

  # ---------------------------------------------------------------------
  # WOONKAMER - Proxy: light.staande_lamp
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: woonkamer_light_state
    entity_id: light.staande_lamp
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: woonkamer_scene_on_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # SLAAPKAMER - Proxy: light.bedlamp_kel
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: slaapkamer_light_state
    entity_id: light.bedlamp_kel
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: slaapkamer_scene_on_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # COMPUTERKAMER - Proxy: light.393d0976_8033_4897_a389_633158737c15_1
  # (Plank Lamp)
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: computerkamer_light_state
    entity_id: light.393d0976_8033_4897_a389_633158737c15_1
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: computerkamer_scene_on_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # TV KIJKEN (Woonkamer) - Proxy: light.tv_light_bar
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: tv_ambient_light_state
    entity_id: light.tv_light_bar
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: tv_ambient_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # TV KIJKEN IN BED (Slaapkamer) - Proxy: light.led_strip_bed
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: tv_bed_light_state
    entity_id: light.led_strip_bed
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: tv_bed_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # A1 SOCKET - highlights when its smart plug is on (entity_id still
  # says "a1_mini" but the plug now actually powers the A1). The A1 Mini
  # has no smart plug, so it has no equivalent power-toggle sensor.
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: a1_socket_state
    entity_id: switch.bambulab_a1_stopcontact_1
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: a1_button
          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # AUTO SHUTDOWN AFTER PRINT - highlights when the helper is on
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: a1_auto_shutdown_state
    entity_id: input_boolean.printer_automatisch_uit_na_print
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: a1_auto_shutdown_button
          state:
            checked: !lambda return x;

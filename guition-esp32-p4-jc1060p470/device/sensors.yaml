    entity_id: sensor.a1mini_0309da532001059_printvoortgang
    id: a1mini_progress
    on_value:
      - lvgl.label.update:
          id: a1mini_progress_label
          text:
            format: "%.0f%%"
            args: [ 'x' ]

  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_resterende_tijd
    id: a1mini_remaining
    on_value:
      - lvgl.label.update:
          id: a1mini_remaining_label
          text:
            format: "%dh %02dm"
            args: [ '(int)x', '(int)round((x - (int)x) * 60)' ]

  - platform: homeassistant
    entity_id: sensor.a1mini_0309da532001059_nozzle_temperatuur

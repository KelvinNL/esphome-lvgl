          state:
            checked: !lambda return x;

  # ---------------------------------------------------------------------
  # 3D PRINTER SOCKET - highlights when the smart plug is on
  # ---------------------------------------------------------------------
  - platform: homeassistant
    id: printer_socket_state
    entity_id: switch.bambulab_a1_mini_stopcontact_1
    trigger_on_initial_state: true
    on_state:
      then:
        lvgl.widget.update:
          id: printer_button
          state:
            checked: !lambda return x;

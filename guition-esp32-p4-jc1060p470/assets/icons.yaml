# http://materialdesignicons.com/cdn/7.4.47/

# Define icons used
font:
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: icon_font
    size: 48
    bpp: 8
    glyphs: [
      "\U000F0335",  # mdi-lightbulb
      "\U000F042B",  # mdi-printer-3d
      "\U000F1051",  # mdi-led-strip-variant
      "\U000F04B9",  # mdi-sofa
      "\U000F02E3",  # mdi-bed
      "\U000F0AAB",  # mdi-desktop-tower-monitor
      "\U000F12CD",  # mdi-lightbulb-group-off
      "\U000F051F",  # mdi-timer-sand
      "\U000F0FA9",  # mdi-clock-check-outline
      "\U000F0141",  # mdi-chevron-left
      "\U000F0142",  # mdi-chevron-right
      "\U000F0996",  # mdi-progress-clock
      "\U000F09EE",  # mdi-file-document-outline
      "\U000F02BC",  # mdi-layers-outline
      "\U000F050F",  # mdi-thermometer
      "\U000F18BE",  # mdi-shield-sword
      "\U000F011A",  # mdi-castle
      "\U000F0BC6",  # mdi-skull-crossbones
      "\U000F150E",  # mdi-snake
      "\U000F0787",  # mdi-sword-cross
      "\U000F0BA2",  # mdi-grave-stone (substitute for pyramid)
      "\U000F0238",  # mdi-fire
      "\U000F0618",  # mdi-bridge
      "\U000F09F1",  # mdi-flower-tulip
      "\U000F0031",  # mdi-anchor (substitute for pirate)
      "\U000F1424",  # mdi-power-plug-off-outline
      "\U000F0595",  # mdi-weather-partly-cloudy
      "\U000F058E",  # mdi-water-percent
      "\U000F059D",  # mdi-weather-windy
      ]

  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: icon_font_small
    size: 24
    bpp: 8
    glyphs: [
      "\U000F050F",  # mdi-thermometer
      ]


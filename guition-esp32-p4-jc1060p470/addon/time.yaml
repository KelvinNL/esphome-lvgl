# Snmp Time
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Amsterdam
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org
    on_time_sync:
      - script.execute: time_update
      - script.execute: race_countdown_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update
          - script.execute: race_countdown_update

# Race countdown text, computed by race_countdown_update below and applied
# to the label via a normal lvgl.label.update action.
globals:
  - id: race_countdown_text
    type: std::string
    restore_value: no
    initial_value: '"--"'

# Clock
script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: display_time
          text: !lambda |-
            static char time_buf[17];
            auto now = id(sntp_time).now();
            snprintf(time_buf, sizeof(time_buf), "%02d:%02d", now.hour, now.minute);
            return time_buf;

  # Race countdown - parses the "Next F1 Race" datetime from Home Assistant
  # (input_datetime.next_f1_race, updated manually by Kelvin each week) and
  # shows the number of days remaining until it.
  - id: race_countdown_update
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (!now.is_valid()) return;

          std::string raw = id(next_race_raw).state;
          int y = 0, mo = 0, d = 0, h = 0, mi = 0, s = 0;
          if (sscanf(raw.c_str(), "%d-%d-%d %d:%d:%d", &y, &mo, &d, &h, &mi, &s) < 5) return;

          ESPTime target{};
          target.year = y;
          target.month = mo;
          target.day_of_month = d;
          target.hour = h;
          target.minute = mi;
          target.second = s;
          target.recalc_timestamp_local();

          char buf[24];
          if (target.timestamp <= now.timestamp) {
            snprintf(buf, sizeof(buf), "Race day!");
          } else {
            uint32_t diff = (uint32_t)(target.timestamp - now.timestamp);
            unsigned int days = (unsigned int)(diff / 86400);
            snprintf(buf, sizeof(buf), "%u days", days);
          }
          id(race_countdown_text) = std::string(buf);
      - lvgl.label.update:
          id: race_countdown_label
          text: !lambda 'return id(race_countdown_text);'
